name: Build and publish signed CtrlSpeak release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            artifact: CtrlSpeak-windows-x86_64.exe
          - os: ubuntu-22.04
            platform: linux
            artifact: CtrlSpeak-linux-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linux build prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk portaudio19-dev libportaudio2 xclip libx11-6 libxtst6 libxinerama1 libxrandr2 libxi6

      - name: Install clean release dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip freeze > resolved-release-requirements.txt

      - name: Verify tag and application version
        run: python scripts/release.py check-version --tag "${{ github.ref_name }}"

      - name: Run required tests
        run: python -m pytest -m core_headless

      - name: Build one-file application
        run: python -m utils.build_exe

      - name: Smoke-test Windows packaged metadata
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release -Force | Out-Null
          $process = Start-Process -FilePath .\dist\CtrlSpeak.exe `
            -ArgumentList @('--health-check-file', "$env:RUNNER_TEMP\ctrlspeak-health.json") `
            -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "CtrlSpeak.exe health check failed" }
          $health = Get-Content -Raw "$env:RUNNER_TEMP\ctrlspeak-health.json" | ConvertFrom-Json
          $expectedVersion = ('${{ github.ref_name }}').Substring(1)
          if ($health.product -ne 'ctrlspeak' -or $health.version -ne $expectedVersion -or -not $health.frozen) { throw "Invalid packaged health metadata" }
          Copy-Item -LiteralPath .\dist\CtrlSpeak.exe -Destination .\release\CtrlSpeak-windows-x86_64.exe

      - name: Smoke-test Linux packaged metadata
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          chmod +x dist/CtrlSpeak
          dist/CtrlSpeak --health-check-file "$RUNNER_TEMP/ctrlspeak-health.json"
          python -c "import json,os; p=json.load(open(os.environ['RUNNER_TEMP']+'/ctrlspeak-health.json')); assert p['product']=='ctrlspeak' and p['version']=='${GITHUB_REF_NAME#v}' and p['frozen'] is True"
          cp dist/CtrlSpeak release/CtrlSpeak-linux-x86_64
          chmod 755 release/CtrlSpeak-linux-x86_64

      - name: Record build provenance
        shell: bash
        run: |
          python --version > release/${{ matrix.platform }}-build-provenance.txt
          python -m PyInstaller --version >> release/${{ matrix.platform }}-build-provenance.txt
          cat resolved-release-requirements.txt >> release/${{ matrix.platform }}-build-provenance.txt

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: |
            release/${{ matrix.artifact }}
            release/${{ matrix.platform }}-build-provenance.txt
          if-no-files-found: error
          retention-days: 14

  manifest:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install release-metadata dependencies
        run: python -m pip install "cryptography>=43,<47" requests

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      - name: Generate and sign canonical update manifest
        env:
          CTRLSPEAK_UPDATE_SIGNING_KEY: ${{ secrets.CTRLSPEAK_UPDATE_SIGNING_KEY }}
        run: |
          python scripts/release.py generate \
            --tag "${{ github.ref_name }}" \
            --windows release/CtrlSpeak-windows-x86_64.exe \
            --linux release/CtrlSpeak-linux-x86_64 \
            --output-dir release

      - name: Independently verify release set
        run: |
          chmod +x release/CtrlSpeak-linux-x86_64
          python scripts/release.py verify --directory release --tag "${{ github.ref_name }}"

      - uses: actions/upload-artifact@v4
        with:
          name: release-metadata
          path: |
            release/update-manifest.json
            release/update-manifest.sig
            release/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: manifest
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install release-audit dependencies
        run: python -m pip install "cryptography>=43,<47" requests

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      - name: Verify assembled release set before upload
        run: |
          chmod +x release/CtrlSpeak-linux-x86_64
          python scripts/release.py verify --directory release --tag "${{ github.ref_name }}"

      - name: Create draft release with exactly five public assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --draft \
            --generate-notes \
            --title "CtrlSpeak ${GITHUB_REF_NAME#v}" \
            release/CtrlSpeak-windows-x86_64.exe \
            release/CtrlSpeak-linux-x86_64 \
            release/update-manifest.json \
            release/update-manifest.sig \
            release/SHA256SUMS

      - name: Download and audit draft assets, then publish stable release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = "true"
          mkdir audit
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir audit
          test "$(find audit -maxdepth 1 -type f | wc -l)" -eq 5
          chmod +x audit/CtrlSpeak-linux-x86_64
          python scripts/release.py verify --directory audit --tag "$GITHUB_REF_NAME"
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
