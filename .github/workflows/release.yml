name: Build and publish signed CtrlSpeak release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: ctrlspeak-release
  cancel-in-progress: false

jobs:
  service-tests:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install fastapi==0.139.0 httpx==0.28.1 python-multipart==0.0.32 pytest==8.4.2 av==18.0.0 numpy==2.2.6 requests==2.32.5
      - run: python -m pip install -e server/whisper_transcription --no-deps
      - run: python scripts/run_bounded_tests.py --timeout 180 --cwd server/whisper_transcription -q

  build:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            artifact: CtrlSpeak-windows-x86_64.exe
          - os: ubuntu-22.04
            platform: linux
            artifact: CtrlSpeak-linux-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linux build prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk portaudio19-dev libportaudio2 xclip libx11-6 libxtst6 libxinerama1 libxrandr2 libxi6

      - name: Install clean release dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip freeze > resolved-release-requirements.txt

      - name: Verify tag and application version
        run: python scripts/release.py check-version --tag "${{ github.ref_name }}"

      - name: Run required tests
        run: python scripts/run_bounded_tests.py --timeout 180 -m core_headless

      - name: Build one-file application
        run: python -m utils.build_exe

      - name: Smoke-test Windows packaged metadata
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release -Force | Out-Null
          $process = Start-Process -WindowStyle Hidden -FilePath .\dist\CtrlSpeak.exe `
            -ArgumentList @('--health-check-file', "$env:RUNNER_TEMP\ctrlspeak-health.json") `
            -PassThru
          if (-not $process.WaitForExit(90000)) {
            taskkill /PID $process.Id /T /F | Out-Null
            throw "Packaged health check exceeded 90 seconds"
          }
          if ($process.ExitCode -ne 0) { throw "CtrlSpeak.exe health check failed" }
          $health = Get-Content -Raw "$env:RUNNER_TEMP\ctrlspeak-health.json" | ConvertFrom-Json
          $expectedVersion = ('${{ github.ref_name }}').Substring(1)
          if ($health.product -ne 'ctrlspeak' -or $health.version -ne $expectedVersion -or -not $health.frozen) { throw "Invalid packaged health metadata" }
          if (-not $health.audio_transport.bit_perfect) { throw "Packaged FLAC codec failed" }
          $versionInfo = (Get-Item -LiteralPath .\dist\CtrlSpeak.exe).VersionInfo
          if ($versionInfo.FileVersion -ne $expectedVersion -or $versionInfo.ProductVersion -ne $expectedVersion) { throw "Invalid packaged Windows version resource" }
          Copy-Item -LiteralPath .\dist\CtrlSpeak.exe -Destination .\release\CtrlSpeak-windows-x86_64.exe

      - name: Smoke-test Linux packaged metadata
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          chmod +x dist/CtrlSpeak
          timeout 90 dist/CtrlSpeak --health-check-file "$RUNNER_TEMP/ctrlspeak-health.json"
          python -c "import json,os; p=json.load(open(os.environ['RUNNER_TEMP']+'/ctrlspeak-health.json')); assert p['product']=='ctrlspeak' and p['version']=='${GITHUB_REF_NAME#v}' and p['frozen'] is True"
          python -c "import json,os; assert json.load(open(os.environ['RUNNER_TEMP']+'/ctrlspeak-health.json'))['audio_transport']['bit_perfect'] is True"
          cp dist/CtrlSpeak release/CtrlSpeak-linux-x86_64
          chmod 755 release/CtrlSpeak-linux-x86_64

      - name: Record build provenance
        shell: bash
        run: |
          python --version > release/${{ matrix.platform }}-build-provenance.txt
          python -m PyInstaller --version >> release/${{ matrix.platform }}-build-provenance.txt
          cat resolved-release-requirements.txt >> release/${{ matrix.platform }}-build-provenance.txt

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: |
            release/${{ matrix.artifact }}
            release/${{ matrix.platform }}-build-provenance.txt
          if-no-files-found: error
          retention-days: 14

  manifest:
    needs: [build, service-tests]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install release-metadata dependencies
        run: python -m pip install "cryptography>=43,<47" requests

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      - name: Generate and sign canonical update manifest
        env:
          CTRLSPEAK_UPDATE_SIGNING_KEY: ${{ secrets.CTRLSPEAK_UPDATE_SIGNING_KEY }}
        run: |
          python scripts/release.py generate \
            --tag "${{ github.ref_name }}" \
            --windows release/CtrlSpeak-windows-x86_64.exe \
            --linux release/CtrlSpeak-linux-x86_64 \
            --output-dir release

      - name: Independently verify release set
        run: |
          chmod +x release/CtrlSpeak-linux-x86_64
          python scripts/release.py verify --directory release --tag "${{ github.ref_name }}"

      - uses: actions/upload-artifact@v4
        with:
          name: release-metadata
          path: |
            release/update-manifest.json
            release/update-manifest.sig
            release/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: manifest
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    environment: ctrlspeak-production
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install release-audit dependencies
        run: python -m pip install "cryptography>=43,<47" requests

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      - name: Verify assembled release set before upload
        run: |
          chmod +x release/CtrlSpeak-linux-x86_64
          python scripts/release.py verify --directory release --tag "${{ github.ref_name }}"

      - name: Create or reconcile immutable draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --draft \
            --generate-notes \
            --title "CtrlSpeak ${GITHUB_REF_NAME#v}" \
            release/CtrlSpeak-windows-x86_64.exe \
            release/CtrlSpeak-linux-x86_64 \
            release/update-manifest.json \
            release/update-manifest.sig \
            release/SHA256SUMS
          fi

      - name: Join private deployment network
        env:
          CI_WIREGUARD: ${{ secrets.CTRLSPEAK_CI_WIREGUARD }}
          CI_SSH_KEY: ${{ secrets.CTRLSPEAK_CI_SSH_KEY }}
          CI_KNOWN_HOSTS: ${{ secrets.CTRLSPEAK_CI_KNOWN_HOSTS }}
        run: |
          sudo apt-get update
          sudo apt-get install -y wireguard-tools
          python - <<'PY'
          import os
          from pathlib import Path
          os.umask(0o077)
          root = Path.home()/'.ssh'; root.mkdir(exist_ok=True)
          # gh secret set trims stdin's final LF; OpenSSH requires it. Also
          # normalize credentials uploaded from a Windows administration host.
          (root/'ctrlspeak-deploy').write_text(os.environ['CI_SSH_KEY'].replace('\r\n', '\n').rstrip()+'\n')
          (root/'known_hosts').write_text(os.environ['CI_KNOWN_HOSTS'])
          Path(os.environ['RUNNER_TEMP']+'/ci.conf').write_text(os.environ['CI_WIREGUARD'])
          PY
          sudo install -m 600 "$RUNNER_TEMP/ci.conf" /etc/wireguard/ci.conf
          sudo wg-quick up ci
          echo "CTRLSPEAK_DEPLOY_KEY=$HOME/.ssh/ctrlspeak-deploy" >> "$GITHUB_ENV"

      - name: Independently audit uploaded candidate before activation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir audit
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir audit
          test "$(find audit -maxdepth 1 -type f | wc -l)" -eq 5
          chmod +x audit/CtrlSpeak-linux-x86_64
          python scripts/release.py verify --directory audit --tag "$GITHUB_REF_NAME"
          cmp release/update-manifest.json audit/update-manifest.json
          cmp release/update-manifest.sig audit/update-manifest.sig

      - name: Stage, deploy and verify required backend fleet
        env:
          CTRLSPEAK_DEPLOY_HOSTS: ${{ secrets.CTRLSPEAK_DEPLOY_HOSTS }}
        run: python scripts/deploy_fleet.py --directory release

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deployment-receipt
          path: release/deployment-receipt.json
          if-no-files-found: warn

      - name: Download and audit draft assets, then publish stable release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = "true" ]; then
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          fi

      - name: Reconcile installed Ubuntu desktop companion
        env:
          CTRLSPEAK_DEPLOY_HOSTS: ${{ secrets.CTRLSPEAK_DEPLOY_HOSTS }}
        run: python scripts/deploy_fleet.py --directory release --desktop-only

      - name: Leave private deployment network
        if: always()
        run: |
          sudo wg-quick down ci || true
          sudo rm -f /etc/wireguard/ci.conf
          rm -f "$RUNNER_TEMP/ci.conf" "$HOME/.ssh/ctrlspeak-deploy"
